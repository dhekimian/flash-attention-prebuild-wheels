# Run the published ROCm wheels on real consumer AMD GPUs.
#
# The ROCm wheels are built for gfx90a..gfx1201, but the build runners have no
# AMD GPU, so CI only checks `import flash_attn` (PR #160: gfx1151/gfx1201
# "have not been exercised on hardware"). This job installs a released wheel on
# a Radeon 8060S (Strix Halo, gfx1151) and a Radeon AI PRO R9700 (gfx1201) and
# runs a sample of upstream flash-attention's own CK tests at the wheel's commit.
#
# Every run uploads summary-<gpu>.json (versions, device, pass/fail counts) so
# results compare across releases. Other workflows call this one for a version
# matrix (workflow_call).
#
# Runners: AMD DevLab, a donated pool of ephemeral, single-use machines. One
# job per machine; nothing persists between jobs.
name: ROCm wheel test (gfx1151, gfx1201)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release to test (a tag, or "latest")
        default: latest
      combo:
        description: Wheel to pick, e.g. rocm7.1torch2.12 (empty = newest in the release)
        default: ""
      tests_per_function:
        description: Upstream CK test cases to run per test function
        default: "30"
  workflow_call:
    inputs:
      release_tag: {type: string, default: latest}
      combo: {type: string, default: ""}
      tests_per_function: {type: string, default: "30"}
      torch_spec:
        description: Override the torch requirement; {gfx} becomes the job's chip
        type: string
        default: ""
      torch_index_url:
        description: Override the index torch comes from
        type: string
        default: ""
      label:
        description: Names the summary artifact (e.g. matrix, canary)
        type: string
        default: release
      expect_torch_crash:
        description: >-
          Chips (e.g. "gfx1151") where this torch build is known to crash on its
          own. There a crash is recorded as torch-unsupported and the wheel steps
          are skipped; anywhere else a torch crash fails the job.
        type: string
        default: ""

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.gpu }} (${{ matrix.gfx }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - gpu: strix-halo
            gfx: gfx1151
          - gpu: radeon-r9700
            gfx: gfx1201
    runs-on: [self-hosted, Linux, devlab-dispatch, "${{ matrix.gpu }}"]
    timeout-minutes: 75
    env:
      # Releases live in the upstream repo; a fork testing this workflow can
      # point at them with a repository variable.
      WHEEL_REPO: ${{ vars.WHEEL_REPO || github.repository }}
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag || 'latest' }}
      COMBO: ${{ inputs.combo || '' }}
      PER_FUNCTION: ${{ inputs.tests_per_function || '30' }}
      TORCH_SPEC: ${{ inputs.torch_spec || '' }}
      TORCH_INDEX_URL: ${{ inputs.torch_index_url || '' }}
      # Where torch's ROCm wheels come from by default; a runner pool with a
      # mirror can set TORCH_INDEX_BASE.
      TORCH_INDEX_BASE: ${{ vars.TORCH_INDEX_BASE || 'https://download.pytorch.org/whl' }}
      LABEL: ${{ inputs.label || 'release' }}
      EXPECT_TORCH_CRASH: ${{ inputs.expect_torch_crash || '' }}
      TORCH_INDEX_MAP: ${{ vars.TORCH_INDEX_MAP }}
      SAMPLER_DIR: ${{ github.workspace }}/../devlab-sampler
    steps:
      - name: Write the test sampler
        run: |
          # A pytest plugin that keeps a deterministic sample at collection time:
          # every pytest-xdist worker selects the same tests, and node ids never
          # pass through the shell.
          mkdir -p "$SAMPLER_DIR"
          cat > "$SAMPLER_DIR/devlab_sample.py" <<'PY'
          import os
          from collections import defaultdict


          def pytest_collection_modifyitems(config, items):
              per = int(os.environ.get("DEVLAB_PER") or 0)
              if per <= 0:
                  return
              by_file = os.environ.get("DEVLAB_GROUP", "function") == "file"
              groups = defaultdict(list)
              for item in items:
                  nodeid = item.nodeid
                  groups[nodeid.split("::")[0] if by_file else nodeid.split("[")[0]].append(item)
              keep = set()
              for members in groups.values():
                  step = max(1, len(members) // per)
                  keep.update(id(i) for i in members[::step][:per])
              config.hook.pytest_deselected(items=[i for i in items if id(i) not in keep])
              items[:] = [i for i in items if id(i) in keep]
          PY

      - name: Pick the wheel for this machine's Python
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          py=$(python3 -c 'import sys; print(f"cp{sys.version_info[0]}{sys.version_info[1]}")')
          api="https://api.github.com/repos/$WHEEL_REPO/releases"
          if [ "$RELEASE_TAG" = latest ]; then url="$api/latest"; else url="$api/tags/$RELEASE_TAG"; fi
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" "$url" > release.json
          python3 - "$py" "$COMBO" <<'PY' >> "$GITHUB_OUTPUT"
          import json, re, sys
          py, combo = sys.argv[1], sys.argv[2]
          rel = json.load(open("release.json"))
          pat = re.compile(r"^flash_attn-(?P<fa>[\d.]+)\+rocm(?P<rocm>[\d.]+)torch(?P<torch>[\d.]+)"
                           r"(?:git(?P<git>[0-9a-f]+))?-" + py + "-" + py + r"-linux_x86_64\.whl$")
          cands = []
          for a in rel["assets"]:
              m = pat.match(a["name"])
              if m and (not combo or f"rocm{m['rocm']}torch{m['torch']}" == combo):
                  key = (tuple(map(int, m["torch"].split("."))), tuple(map(int, m["rocm"].split("."))))
                  cands.append((key, a, m))
          if not cands:
              sys.exit(f"no ROCm wheel for {py} {combo or ''} in {rel['tag_name']}")
          _, a, m = max(cands, key=lambda c: c[0])
          for k, v in {"tag": rel["tag_name"], "name": a["name"], "url": a["browser_download_url"],
                       "fa": m["fa"], "rocm": m["rocm"], "torch": m["torch"], "git": m["git"] or "",
                       "py": py}.items():
              print(f"{k}={v}")
          PY
          cat "$GITHUB_OUTPUT"

      - name: Install torch
        run: |
          set -euo pipefail
          python3 -m venv venv
          . venv/bin/activate
          pip install -q --upgrade pip
          spec="${TORCH_SPEC:-torch==${{ steps.pick.outputs.torch }}.*}"
          spec="${spec//\{gfx\}/${{ matrix.gfx }}}"     # e.g. torch[device-{gfx}] for TheRock
          INDEX="${TORCH_INDEX_URL:-$TORCH_INDEX_BASE/rocm${{ steps.pick.outputs.rocm }}}"
          # A runner pool with a package mirror maps public indexes to it with the
          # TORCH_INDEX_MAP repository variable (JSON: index URL -> mirror URL).
          # Unset, the index is used as given.
          if [ -n "${TORCH_INDEX_MAP:-}" ]; then
            idx_in="$INDEX"
            INDEX=$(python3 -c 'import json,sys; m=json.loads(sys.argv[1]); u=sys.argv[2]; print(m.get(u.rstrip("/")+"/", m.get(u.rstrip("/"), u)))' "$TORCH_INDEX_MAP" "$INDEX")
            [ "$INDEX" = "$idx_in" ] || echo "torch index mapped: $idx_in -> $INDEX"
          fi
          index="$INDEX"
          echo "torch: $spec from $index"
          # Only the torch index: the host's pip.conf adds PyPI as an extra index,
          # and PyPI's CUDA torch can outrank the ROCm build.
          PIP_CONFIG_FILE=/dev/null pip install -q "$spec" --index-url "$index"
          # Pin the torch stack for every later pip call: a package that depends on
          # torch can otherwise replace the ROCm build with a CUDA wheel from PyPI,
          # and the tests run on the CPU.
          pip freeze | grep -iE '^(torch|torchvision|torchaudio|triton|pytorch-triton-rocm|rocm[a-z0-9_-]*)==' \
            > "$RUNNER_TEMP/torch-pin.txt"
          cat "$RUNNER_TEMP/torch-pin.txt"
          export PIP_CONSTRAINT="$RUNNER_TEMP/torch-pin.txt"
          echo "PIP_CONSTRAINT=$PIP_CONSTRAINT" >> "$GITHUB_ENV"

      - name: Probe torch alone on this GPU
        id: probe
        run: |
          # Before any flash_attn code: if torch itself crashes on this chip, the
          # result is about the torch build, not the wheel. Some torch builds
          # segfault on gfx1151 at the first GPU op.
          . venv/bin/activate
          set +e
          python -u - <<'PY'
          import faulthandler, json, torch, torch.nn.functional as F
          faulthandler.enable()
          p = torch.cuda.get_device_properties(0)
          info = {"torch": torch.__version__, "hip": torch.version.hip, "device": p.name,
                  "arch": p.gcnArchName}
          print(info, flush=True)
          json.dump(info, open("probe-env.json", "w"))
          assert torch.version.hip, "torch is not a ROCm build"
          assert "${{ matrix.gfx }}" in p.gcnArchName, f"expected ${{ matrix.gfx }}, got {p.gcnArchName}"
          x = torch.randn(256, 256, device="cuda", dtype=torch.float16)
          (x @ x).float().sum().item()
          y = torch.randn(1, 4, 128, 64, device="cuda", dtype=torch.float16)
          F.scaled_dot_product_attention(y, y, y).float().sum().item()
          print("torch alone: matmul and SDPA ok")
          PY
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then result=ok
          elif [ "$rc" -gt 128 ]; then result=crash     # killed by a signal (139 = SIGSEGV)
          else result=error; fi
          expected=false
          case " ${EXPECT_TORCH_CRASH//,/ } " in *" ${{ matrix.gfx }} "*) expected=true ;; esac
          printf '{"result": "%s", "exit": %d, "expected_crash": %s}\n' "$result" "$rc" "$expected" > probe.json
          cat probe.json
          echo "torch_alone=$result" >> "$GITHUB_OUTPUT"
          if [ "$result" = ok ]; then
            [ "$expected" = false ] || echo "::notice::torch alone works on ${{ matrix.gfx }} now; drop it from expect_torch_crash"
            exit 0
          fi
          msg="torch alone fails on ${{ matrix.gfx }} (exit $rc): this torch build does not run on this chip; flash_attn was not tested"
          if [ "$result" = crash ] && [ "$expected" = true ]; then
            echo "::warning::$msg (expected: expect_torch_crash)"
            exit 0
          fi
          echo "::error::$msg"
          exit 1

      - name: Install the wheel
        if: steps.probe.outputs.torch_alone == 'ok'
        run: |
          set -euo pipefail
          . venv/bin/activate
          curl -fsSL -o "${{ steps.pick.outputs.name }}" "${{ steps.pick.outputs.url }}"
          pip install -q "${{ steps.pick.outputs.name }}" pytest pytest-timeout einops numpy
          python - <<'PY'
          import json, torch, flash_attn
          # The wheel is CK-only. Without its compiled module flash_attn can fall
          # back to Triton and this job would test something else.
          import flash_attn_2_cuda  # noqa: F401
          p = torch.cuda.get_device_properties(0)
          info = {"torch": torch.__version__, "hip": torch.version.hip, "device": p.name,
                  "arch": p.gcnArchName, "flash_attn": flash_attn.__version__}
          print(info)
          json.dump(info, open("env.json", "w"))
          assert "${{ matrix.gfx }}" in p.gcnArchName, f"expected ${{ matrix.gfx }}, got {p.gcnArchName}"
          PY

      - name: Fetch upstream tests at the wheel's commit
        if: steps.probe.outputs.torch_alone == 'ok'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ref="${{ steps.pick.outputs.git }}"
          if [ -n "$ref" ]; then
            ref=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/Dao-AILab/flash-attention/commits/$ref" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["sha"])')
          else
            ref="v${{ steps.pick.outputs.fa }}"
          fi
          git init -q fa && cd fa
          git remote add origin https://github.com/Dao-AILab/flash-attention.git
          git fetch -q --depth 1 origin "$ref"
          git checkout -q FETCH_HEAD -- tests
          echo "tests from $ref"

      - name: Smoke test against PyTorch attention
        if: steps.probe.outputs.torch_alone == 'ok'
        run: |
          . venv/bin/activate
          python -u - <<'PY'
          import faulthandler, json, torch, torch.nn.functional as F
          faulthandler.enable()
          from flash_attn import flash_attn_func
          torch.manual_seed(0)
          passed = failed = 0
          for dtype in (torch.float16, torch.bfloat16):
              for (b, s, h, d) in [(2, 128, 8, 64), (1, 1024, 16, 128), (4, 333, 4, 96)]:
                  for causal in (False, True):
                      q, k, v = (torch.randn(b, s, h, d, device="cuda", dtype=dtype, requires_grad=True)
                                 for _ in range(3))
                      out = flash_attn_func(q, k, v, causal=causal)
                      ref = F.scaled_dot_product_attention(q.transpose(1, 2), k.transpose(1, 2),
                                                           v.transpose(1, 2), is_causal=causal).transpose(1, 2)
                      err = (out - ref).abs().max().item()
                      out.sum().backward()
                      ok = err < (2e-2 if dtype == torch.bfloat16 else 5e-3) and bool(torch.isfinite(q.grad).all())
                      passed += ok
                      failed += not ok
                      print(f"{'ok  ' if ok else 'FAIL'} {dtype} b{b} s{s} h{h} d{d} causal={causal} max|err|={err:.2e}")
          json.dump({"passed": passed, "failed": failed}, open("smoke.json", "w"))
          raise SystemExit(failed)
          PY

      - name: Upstream CK tests (deterministic sample)
        if: steps.probe.outputs.torch_alone == 'ok'
        working-directory: fa
        run: |
          set -euo pipefail
          . ../venv/bin/activate
          PYTHONPATH="$SAMPLER_DIR" DEVLAB_PER="$PER_FUNCTION" DEVLAB_GROUP=function \
            python -m pytest tests/test_flash_attn_ck.py -p devlab_sample -q -rf -p no:cacheprovider \
            --timeout=600 --junitxml=../junit.xml

      - name: Write the run summary
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, datetime, xml.etree.ElementTree as ET
          def load(p):
              try:
                  return json.load(open(p))
              except Exception:
                  return None
          tests = None
          if os.path.exists("junit.xml"):
              s = ET.parse("junit.xml").getroot()
              s = s if s.tag == "testsuite" else s.find("testsuite")
              n = {k: int(s.get(k, 0)) for k in ("tests", "failures", "errors", "skipped")}
              tests = {"ran": n["tests"], "failed": n["failures"], "errors": n["errors"],
                       "skipped": n["skipped"],
                       "passed": n["tests"] - n["failures"] - n["errors"] - n["skipped"],
                       "seconds": round(float(s.get("time", 0)), 1)}
          probe = load("probe.json") or {}
          torch_alone = probe.get("result")          # ok | crash | error | None (not reached)
          smoke = load("smoke.json") or {}
          if torch_alone:
              smoke = {"torch_alone": torch_alone, **smoke}
          # One word per cell for the compatibility table. torch-unsupported means
          # the torch build itself does not run on this chip: no wheel verdict.
          if torch_alone == "crash":
              verdict = "torch-unsupported" + ("-expected" if probe.get("expected_crash") else "")
          elif torch_alone == "error":
              verdict = "torch-error"                # e.g. not a ROCm build, wrong chip
          elif "${{ job.status }}" == "success":
              verdict = "pass"
          else:
              verdict = "fail"
          summary = {
              "schema": 1, "project": "flash-attention-prebuild-wheels", "label": os.environ["LABEL"],
              "release": "${{ steps.pick.outputs.tag }}", "wheel": "${{ steps.pick.outputs.name }}",
              "combo": "rocm${{ steps.pick.outputs.rocm }}torch${{ steps.pick.outputs.torch }}",
              "torch_spec": os.environ.get("TORCH_SPEC", ""), "gpu": "${{ matrix.gpu }}",
              "gfx": "${{ matrix.gfx }}", "env": load("env.json") or load("probe-env.json"), "smoke": smoke or None,
              "tests": tests, "verdict": verdict, "job_status": "${{ job.status }}",
              "run": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
              "finished": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds"),
          }
          json.dump(summary, open("summary.json", "w"), indent=1)
          print(json.dumps(summary, indent=1))
          PY

      - name: Upload the run summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: devlab-summary-${{ inputs.label || 'release' }}-${{ steps.pick.outputs.tag || 'unknown' }}-rocm${{ steps.pick.outputs.rocm }}torch${{ steps.pick.outputs.torch }}-${{ matrix.gpu }}
          path: summary.json
          retention-days: 90
